<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>🐧 펭귄 자판기</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

  <!-- =========================
       상단
  ========================== -->
  <header id="topBar">

    <div class="topPenguin">
      🐧
    </div>

    <div id="starBox">
      ⭐ <span id="score">0</span>
    </div>

    <button id="soundButton" class="circleButton">
      🔊
    </button>

  </header>


  <!-- =========================
       손님 영역
  ========================== -->
  <section id="customerArea">

    <div class="cloud cloud1">☁️</div>
    <div class="cloud cloud2">☁️</div>

    <div class="iceDecoration ice1">❄️</div>
    <div class="iceDecoration ice2">❄️</div>

    <div id="customerBox">

      <!-- 주문 말풍선 -->
      <div id="orderBubble">
        <div id="orderPictures">
          🐟
        </div>
      </div>

      <!-- 손님 -->
      <div id="customerCharacter">
        🐧
      </div>

      <div id="customerHat"></div>

    </div>

  </section>


  <!-- =========================
       자판기
  ========================== -->
  <section id="vendingArea">

    <div id="vendingMachine">

      <!-- 자판기 간판 -->
      <div id="machineSign">

        <span>🐧</span>

        <div class="signLights">
          <span></span>
          <span></span>
          <span></span>
        </div>

        <span>⭐</span>

      </div>


      <!-- 상품 진열 -->
      <div id="products">

        <button class="productButton" data-item="fish">
          <div class="productWindow">
            🐟
          </div>
          <div class="littleButton"></div>
        </button>


        <button class="productButton" data-item="juice">
          <div class="productWindow">
            🧃
          </div>
          <div class="littleButton"></div>
        </button>


        <button class="productButton" data-item="icecream">
          <div class="productWindow">
            🍦
          </div>
          <div class="littleButton"></div>
        </button>


        <button class="productButton" data-item="cookie">
          <div class="productWindow">
            🍪
          </div>
          <div class="littleButton"></div>
        </button>


        <button class="productButton" data-item="strawberry">
          <div class="productWindow">
            🍓
          </div>
          <div class="littleButton"></div>
        </button>


        <button class="productButton" data-item="milk">
          <div class="productWindow">
            🥛
          </div>
          <div class="littleButton"></div>
        </button>


        <button class="productButton" data-item="apple">
          <div class="productWindow">
            🍎
          </div>
          <div class="littleButton"></div>
        </button>


        <button class="productButton" data-item="cake">
          <div class="productWindow">
            🧁
          </div>
          <div class="littleButton"></div>
        </button>

      </div>


      <!-- 자판기 하단 -->
      <div id="machineBottom">

        <div id="coinPart">
          <div class="coinPicture">🪙</div>
          <div class="coinHole"></div>
        </div>


        <!-- 상품 떨어지는 곳 -->
        <div id="deliveryDoor">

          <div id="deliveryItem"></div>

        </div>

      </div>

    </div>

  </section>


  <!-- =========================
       하단 안내
  ========================== -->
  <section id="bottomArea">

    <div id="guideBox">

      <span id="guideEmoji">👆</span>

      <span id="guideText">
        같은 그림을 찾아봐!
      </span>

    </div>


    <div id="pickedItems"></div>

  </section>


  <!-- =========================
       꾸미기 버튼
  ========================== -->

  <button id="dressOpenButton">
    🎀
  </button>


  <!-- =========================
       성공 팝업
  ========================== -->

  <div id="successScreen" class="overlay hidden">

    <div class="popup">

      <div id="happyPenguin">
        🐧
      </div>

      <div class="starParty">
        ⭐ ⭐ ⭐
      </div>

      <div id="rewardPicture">
        🎁
      </div>

      <button id="nextButton">
        ▶️
      </button>

    </div>

  </div>


  <!-- =========================
       꾸미기 팝업
  ========================== -->

  <div id="dressScreen" class="overlay hidden">

    <div class="popup">

      <div class="dressTitle">
        🐧 ✨
      </div>

      <div id="dressPenguin">

        <div id="dressAccessory"></div>

        🐧

      </div>


      <div id="dressChoices">

        <button class="dressChoice" data-dress="👑">
          👑
        </button>

        <button class="dressChoice" data-dress="🎀">
          🎀
        </button>

        <button class="dressChoice" data-dress="🧢">
          🧢
        </button>

        <button class="dressChoice" data-dress="👓">
          👓
        </button>

        <button class="dressChoice" data-dress="🧣">
          🧣
        </button>

        <button class="dressChoice" data-dress="">
          ❌
        </button>

      </div>


      <button id="dressCloseButton">
        ✔️
      </button>

    </div>

  </div>


  <!-- =========================
       미니게임
  ========================== -->

  <div id="miniGameScreen" class="overlay hidden">

    <div class="popup miniPopup">

      <div id="miniGameTitle">
        ❄️
      </div>

      <div id="miniGameArea"></div>

    </div>

  </div>

</div>


<!-- 중요: script.js -->
<script src="script.js"></script>

</body>
</html>
