<!doctype html><html lang='ko'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover'><meta name='apple-mobile-web-app-capable' content='yes'><title>펭귄 자판기</title><link rel='stylesheet' href='style.css'></head><body>
<div id='app'>
<header><div class='brand'>🐧 <span>❄️</span></div><div class='hud'><span id='stars'>⭐ 0</span><span id='round'>● ● ● ● ●</span><button id='soundBtn'>🔊</button></div></header>
<main>
<section class='scene' id='scene'>
 <div class='sky'><span class='cloud c1'>☁️</span><span class='cloud c2'>☁️</span><span id='weather'>❄️</span></div>
 <div class='mountains'>🏔️　🏔️　🏔️</div>
 <div class='customerArea'><div id='customer' class='customer'>🐧</div><div id='accessory' class='accessory'></div><div id='bubble' class='bubble'><div id='orderIcons'></div></div></div>
 <div class='machine' id='machine'><div class='machineTop'>🐧　✨　🥤</div><div id='products' class='products'></div><div class='machineBottom'><div id='coinSlot'>🪙</div><div id='tray' class='tray'>▼</div></div><div id='snowCover'></div></div>
 <div id='delivery' class='delivery'></div>
 <div class='ice'>🧊　　🧊　　　　🧊</div>
</section>
<section class='controls'><button id='helpBtn' class='roundBtn'>👀</button><div id='message'>그림을 보고 골라 주세요!</div><button id='dressBtn' class='roundBtn'>🎀</button></section>
</main>
<div id='celebrate' class='overlay hidden'><div class='card'><div id='celebrateFace' class='big'>🐧</div><div id='celebrateText' class='icons'>⭐ ⭐ ⭐</div><button id='nextBtn'>▶️</button></div></div>
<div id='dressOverlay' class='overlay hidden'><div class='card dressCard'><button class='close'>✖️</button><div class='big'>🐧</div><div class='dressGrid'><button data-acc='👑'>👑</button><button data-acc='🎀'>🎀</button><button data-acc='🧣'>🧣</button><button data-acc='👓'>👓</button><button data-acc='🌸'>🌸</button><button data-acc=''>🚫</button></div></div></div>
<div id='miniOverlay' class='overlay hidden'><div class='card miniCard'><div id='miniTitle' class='icons'></div><div id='miniGame'></div></div></div>
</div><script src='game.js'></script></body></html>
